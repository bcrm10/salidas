<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B3FC7">
<title>Salidas · Mario & Danna</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root {
  --fondo: #F7F4FF; --blanco: #FFFFFF; --lila: #E9E2FF; --lila-borde: #B9ABEE; --linea: #E4DEF7;
  --morado: #5B3FC7; --morado-medio: #7C66DD; --tinta: #2A1F5C; --suave: #5F5A7A;
  --celeste: #DCEFFB; --azul: #1F5FAF;
  --r-xl: 28px; --r-l: 22px; --r-m: 16px;
  --titulo: 'Fredoka', 'Nunito', system-ui, sans-serif;
  --texto: 'Nunito', system-ui, sans-serif;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--texto); font-size: 16px; }
body { min-height: 100vh; padding-top: env(safe-area-inset-top, 0px); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--azul); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--titulo); font-weight: 600; margin: 0; }
h1 { font-size: 28px; } h2 { font-size: 20px; } h3 { font-size: 16px; font-family: var(--texto); font-weight: 800; }
.suave { color: var(--suave); }
.chico { font-size: 13px; }

/* Estructura: barra flotante abajo en celular, panel lateral en pantallas anchas */
#app { display: block; }
main { max-width: 560px; margin: 0 auto; padding: 20px 20px calc(110px + env(safe-area-inset-bottom, 0px)); }
.nav { position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  display: flex; gap: 4px; padding: 6px; background: var(--blanco); border: 1px solid var(--linea); border-radius: var(--r-xl);
  box-shadow: 0 6px 20px rgba(91, 63, 199, .14); max-width: 528px; margin: 0 auto; }
.nav .marca, .nav .ahorro-lateral { display: none; }
.nav-item { flex: 1; min-height: 52px; border: 0; background: transparent; border-radius: var(--r-l);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; font-weight: 700; color: var(--suave); }
.nav-item[aria-current="page"] { background: var(--lila); color: var(--morado); font-weight: 800; }
.nav-item .mas { width: 30px; height: 30px; border-radius: 999px; background: var(--morado); color: #fff; display: flex; align-items: center; justify-content: center; }
.nav-item svg { width: 22px; height: 22px; }

@media (min-width: 900px) {
  #app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  main { max-width: 980px; margin: 0; padding: 28px 32px 40px; width: 100%; }
  .nav { position: sticky; top: 0; left: auto; right: auto; bottom: auto; height: 100vh; max-width: none; margin: 0;
    flex-direction: column; gap: 6px; padding: 28px 18px; border: 0; border-right: 1px solid var(--linea); border-radius: 0; box-shadow: none; }
  .nav .marca { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .nav-item { flex: 0 0 auto; flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 14px; min-height: 46px; font-size: 15px; border-radius: var(--r-m); color: var(--tinta); }
  .nav-item[aria-current="page"] { background: var(--morado); color: #fff; }
  .nav-item[aria-current="page"] .mas { background: #fff; color: var(--morado); }
  .nav-item .mas { width: 22px; height: 22px; }
  .nav .ahorro-lateral { display: flex; flex-direction: column; gap: 2px; margin-top: auto; background: var(--celeste); color: var(--azul); border-radius: 18px; padding: 14px; }
  .pila.grilla-escritorio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .pila.grilla-escritorio.dos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grilla-escritorio > .ancho { grid-column: span 2; }
  .grilla-escritorio > .completo { grid-column: 1 / -1; }
}
.marca-logo { width: 40px; height: 40px; border-radius: 14px; background: var(--morado); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--titulo); font-size: 18px; }

/* Piezas */
.pila { display: flex; flex-direction: column; gap: 14px; }
.cabecera { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
.tarjeta { background: var(--blanco); border-radius: var(--r-l); padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.tarjeta.celeste { background: var(--celeste); }
.tarjeta.celeste h3 { color: var(--azul); }
.hero { background: var(--morado); color: #fff; border-radius: var(--r-xl); padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.hero .monto { font-family: var(--titulo); font-weight: 600; font-size: 52px; line-height: 1; }
.hero.negativo { background: var(--tinta); }
.barra { height: 12px; background: var(--morado-medio); border-radius: 999px; overflow: hidden; }
.barra > span { display: block; height: 100%; background: #fff; border-radius: 999px; }
.fila { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lista { background: var(--blanco); border-radius: var(--r-l); padding: 4px 16px; }
.lista > * { padding: 11px 0; border-bottom: 1px solid #EFEAFB; }
.lista > *:last-child { border-bottom: 0; }
.pastilla { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.p-azul { background: var(--celeste); color: var(--azul); }
.p-morado { background: var(--morado); color: #fff; }
.p-lila { background: var(--lila); color: var(--morado); }
.btn { min-height: 48px; border: 0; border-radius: 999px; padding: 0 20px; font-weight: 800; font-size: 15px; background: var(--morado); color: #fff; }
.btn.azul { background: var(--azul); }
.btn.lila { background: var(--lila); color: var(--morado); }
.btn.chico { min-height: 40px; font-size: 13px; padding: 0 16px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-texto { border: 0; background: none; color: var(--morado); font-weight: 800; padding: 8px; min-height: 40px; }

/* Días de la semana */
.dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dia { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--suave); }
.dia .circulo { width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--tinta); background: var(--lila); }
.dia.opcional .circulo { background: transparent; border: 2px dashed var(--lila-borde); color: var(--suave); }
.dia.salieron .circulo { background: var(--azul); color: #fff; }
.dia.hoy .circulo { box-shadow: 0 0 0 3px var(--morado); }
.dia.otro-mes { opacity: .45; }
.dia .gasto { font-size: 10px; font-weight: 800; color: var(--azul); min-height: 13px; }
.leyenda { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; font-weight: 600; color: var(--suave); }

/* Formularios */
label.campo { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800; color: var(--suave); }
.entrada { min-height: 50px; padding: 0 18px; border: 1px solid var(--linea); border-radius: 999px; background: var(--blanco); font-size: 16px; color: var(--tinta); }
.monto-grande { text-align: center; border: 0; background: transparent; font-family: var(--titulo); font-size: 48px; font-weight: 600; color: var(--morado); width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 42px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--blanco); font-size: 14px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--morado); color: #fff; }
.chip.azul[aria-pressed="true"] { background: var(--azul); }
.segmento { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 999px; background: var(--lila); }
.segmento button { min-height: 44px; border: 0; border-radius: 999px; background: transparent; font-weight: 700; }
.segmento button[aria-pressed="true"] { background: var(--morado); color: #fff; font-weight: 800; }
.opcion-tarjeta { min-height: 56px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #EFEAFB; cursor: pointer; }
.opcion-tarjeta:last-child { border-bottom: 0; }
.opcion-tarjeta input { width: 20px; height: 20px; margin: 0; accent-color: var(--morado); }
.inicial { width: 34px; height: 34px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: var(--lila); color: var(--morado); flex-shrink: 0; }
.inicial.m { background: var(--celeste); color: var(--azul); }
.check { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; background: var(--blanco); border-radius: var(--r-l); font-size: 14px; line-height: 1.4; color: var(--suave); }
.check input { width: 22px; height: 22px; margin: 0; accent-color: var(--morado); flex-shrink: 0; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--blanco); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.stat strong { font-family: var(--titulo); font-weight: 600; font-size: 18px; }
.stat.lila { background: var(--lila); color: var(--morado); }
.stat.celeste { background: var(--celeste); color: var(--azul); }
.periodo { background: var(--blanco); border-radius: var(--r-l); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.periodo.en-curso { border: 3px solid var(--morado); padding: 12px 14px; }
.periodo.por-venir { background: transparent; border: 2px dashed var(--lila-borde); padding: 12px 14px; }
.aviso { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20;
  background: var(--tinta); color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; max-width: calc(100% - 32px); }
@media (min-width: 900px) { .aviso { bottom: 24px; } }
.vacio { text-align: center; padding: 24px 12px; color: var(--suave); }

/* Login */
#login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
#login form { width: 100%; max-width: 360px; }
@media (prefers-reduced-motion: no-preference) { .barra > span { transition: width .4s ease; } }
</style>
</head>
<body>

<section id="login" hidden>
  <form class="pila" id="form-login">
    <div class="marca-logo" aria-hidden="true">MD</div>
    <h1>Salidas</h1>
    <p class="suave" style="margin:0">Entra con tu correo para ver y registrar las salidas.</p>
    <label class="campo">Correo<input class="entrada" type="email" name="email" autocomplete="email" required></label>
    <label class="campo">Contraseña<input class="entrada" type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Entrar</button>
    <p class="chico" id="login-error" role="alert" style="margin:0;color:var(--morado);font-weight:700"></p>
  </form>
</section>

<div id="app" hidden>
  <nav class="nav" aria-label="Secciones">
    <div class="marca">
      <span class="marca-logo" aria-hidden="true">MD</span>
      <div><strong style="font-family:var(--titulo);font-size:20px;font-weight:600">Salidas</strong><div class="chico suave">Mario y Danna</div></div>
    </div>
    <button class="nav-item" data-vista="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></button>
    <button class="nav-item" data-vista="mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Mes</span></button>
    <button class="nav-item" data-vista="registrar"><span class="mas" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span>Registrar</span></button>
    <button class="nav-item" data-vista="panoramas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span>Panoramas</span></button>
    <div class="ahorro-lateral"><span class="chico" style="font-weight:800">Ahorro acumulado</span><strong id="ahorro-total" style="font-family:var(--titulo);font-size:22px;font-weight:600">$0</strong></div>
  </nav>
  <main id="vista" aria-live="polite"></main>
</div>

<div class="aviso" id="aviso" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="config.js"></script>
<script src="feriados.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
