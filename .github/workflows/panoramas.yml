name: Renovar panoramas

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 12:00 UTC (mañana en Chile)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/generar_panoramas.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/panoramas.json
          git diff --cached --quiet || (git commit -m "Panoramas de la semana" && git push)
